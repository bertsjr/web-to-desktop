name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # GITHUB_TOKEN is injected into every run automatically and is scoped to
      # this repo by the `permissions: contents: write` above — which is all a
      # release upload needs. electron-builder reads the token from GH_TOKEN,
      # so map it across. Using a PAT secret here instead just adds something
      # that silently expires (and the `GH_TOKEN` secret was never created,
      # so this step failed with "Personal Access Token is not set").
      - name: Build and publish to GitHub Releases
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -f RELEASE-NOTES.md ]; then
            gh release edit "$VERSION" --notes-file RELEASE-NOTES.md
          else
            gh release edit "$VERSION" --notes-file RELEASE-NOTES-TEMPLATE.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
