name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # electron-builder creates one publisher per artifact and they race:
      # each calls getOrCreateRelease(), both see "release doesn't exist", and
      # both create one — which left the installer and its .blockmap in two
      # separate draft releases on v2026.9.1 and v2026.10.1. Creating the draft
      # first closes that window: getOrCreateRelease() matches on tag_name and
      # returns an existing draft immediately, so both publishers just upload.
      - name: Create the draft release up front
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          NOTES=RELEASE-NOTES.md
          [ -f "$NOTES" ] || NOTES=RELEASE-NOTES-TEMPLATE.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - reusing it."
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN is injected into every run automatically and is scoped to
      # this repo by the `permissions: contents: write` above — which is all a
      # release upload needs. electron-builder reads the token from GH_TOKEN,
      # so map it across. Using a PAT secret here instead just adds something
      # that silently expires (and the `GH_TOKEN` secret was never created,
      # so this step failed with "Personal Access Token is not set").
      - name: Build and publish to GitHub Releases
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ -f RELEASE-NOTES.md ]; then
            gh release edit "$VERSION" --notes-file RELEASE-NOTES.md
          else
            gh release edit "$VERSION" --notes-file RELEASE-NOTES-TEMPLATE.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
