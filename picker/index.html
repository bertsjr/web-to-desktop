<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self';" />
  <title>Choose what to share</title>
  <style>
    :root {
      --bg: #1b1f2a; --bar: #11141b; --bar-2: #232838; --border: #2c3242;
      --text: #e7ebf2; --muted: #9aa3b2; --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    header { padding: 14px 18px 10px; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .tabs { display: flex; gap: 6px; padding: 0 18px; }
    .tab {
      background: none; border: none; color: var(--muted);
      padding: 8px 12px; cursor: pointer; font-size: 12.5px;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .grid {
      flex: 1; overflow-y: auto; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px; padding: 14px 18px; align-content: start;
    }
    .src {
      background: var(--bar-2); border: 2px solid var(--border);
      border-radius: 8px; padding: 8px; cursor: pointer;
      display: flex; flex-direction: column; gap: 8px; overflow: hidden;
    }
    .src:hover { border-color: #3b4356; }
    .src.selected { border-color: var(--accent); }
    .thumb {
      width: 100%; aspect-ratio: 16 / 10; object-fit: contain;
      background: #0d1017; border-radius: 4px;
    }
    .label { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .label img { width: 16px; height: 16px; flex: none; }
    .label span {
      font-size: 12px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty { color: var(--muted); padding: 40px; text-align: center; grid-column: 1 / -1; }
    footer {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px; border-top: 1px solid var(--border); background: var(--bar);
    }
    .audio {
      display: flex; align-items: center; gap: 7px; margin-right: auto;
      color: var(--text); font-size: 12.5px; cursor: pointer;
    }
    .audio input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    button.action {
      padding: 8px 18px; border-radius: 6px; font-size: 13px;
      cursor: pointer; border: 1px solid var(--border);
    }
    .cancel { background: var(--bar-2); color: var(--text); }
    .share { background: var(--accent); color: #fff; border-color: var(--accent); }
    .share:disabled { opacity: 0.45; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Choose what to share</h1>
    <p>Select a screen or window to share with the app.</p>
  </header>
  <div class="tabs">
    <button class="tab active" data-type="screen">Entire screen</button>
    <button class="tab" data-type="window">Window</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>
    <label class="audio">
      <input type="checkbox" id="audio" />
      Share system audio
    </label>
    <button class="action cancel" id="cancel">Cancel</button>
    <button class="action share" id="share" disabled>Share</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
